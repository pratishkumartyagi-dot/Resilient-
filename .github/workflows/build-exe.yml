name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paper-search-mcp
        run: |
          python -m pip install --upgrade pip
          pip install paper-search-mcp
          pip install "mcp[cli]>=1.27.2,<2"
        shell: bash

      - name: Verify paper-search-mcp
        run: |
          paper-search-mcp --help 2>/dev/null || echo "paper-search-mcp installed"
          which paper-search-mcp
        shell: bash

      - name: Install dependencies (bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Next.js app
        run: bun run build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package Electron app
        run: bun run dist:win
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: List artifacts
        run: Get-ChildItem -Path dist-electron -Recurse -File | Select-Object Name, Length, FullName
        shell: pwsh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Resilient-Research-App-Windows
          path: |
            dist-electron/*.exe
            dist-electron/*.nsis*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
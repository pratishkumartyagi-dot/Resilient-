name: Electron Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.9.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (setup.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root dependencies
        run: npm ci
        shell: bash

      - name: Build Next.js application
        run: npm run build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install electron dependencies
        run: npm install
        shell: bash
        working-directory: ./electron

      - name: Generate icons (Windows)
        run: |
          # Install ImageMagick for icon generation
          choco install imagemagick -y
          refreshenv
          # Generate icons from SVG
          magick build/icon.svg -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico
          magick build/icon.svg -resize 512x512 build/icon.png
        shell: bash
        working-directory: ./electron

      - name: Build Windows installer
        run: npx electron-builder --win --publish=never
        shell: bash
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/dist/*.exe
          retention-days: 30

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root dependencies
        run: npm ci
        shell: bash

      - name: Build Next.js application
        run: npm run build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install electron dependencies
        run: npm install
        shell: bash
        working-directory: ./electron

      - name: Generate icons (macOS)
        run: |
          # Install ImageMagick
          brew install imagemagick
          # Generate iconset
          mkdir -p build/icon.iconset
          for size in 16 32 64 128 256 512 1024; do
            magick build/icon.svg -resize ${size}x${size} build/icon.iconset/icon_${size}x${size}.png
            magick build/icon.svg -resize $((size*2))x$((size*2)) build/icon.iconset/icon_${size}x${size}@2x.png
          done
          # Generate .icns
          iconutil -c icns build/icon.iconset -o build/icon.icns
        shell: bash
        working-directory: ./electron

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish=never
        shell: bash
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: electron/dist/*.dmg
          retention-days: 30

  build-linux:
    name: Build Linux (AppImage + DEB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
        shell: bash

      - name: Install root dependencies
        run: npm ci
        shell: bash

      - name: Build Next.js application
        run: npm run build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install electron dependencies
        run: npm install
        shell: bash
        working-directory: ./electron

      - name: Generate icons (Linux)
        run: |
          magick build/icon.svg -resize 512x512 build/icon.png
          magick build/icon.svg -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico
        shell: bash
        working-directory: ./electron

      - name: Build Linux packages
        run: npx electron-builder --linux --publish=never
        shell: bash
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Resilient Research App ${{ github.ref_name }}
          body: |
            ## Resilient Research App ${{ github.ref_name }}
            
            ### Changes
            - Native AI Presentation Generator (replaces Presenton dependency)
            - Uses app's existing LLM providers (Gemini, Groq, local Qwen)
            - Professional templates: Academic, Business, Minimal, Conference
            - Fully editable PPTX output
            - Fixed PubMed, Europe PMC, Crossref database issues
            - All 9 databases working: 701 total papers retrieved
            
            ### Installation
            **Windows:** Download `Resilient-Research-App-Setup-${{ github.ref_name }}.exe` and run the installer.
            
            **macOS:** Download `Resilient-Research-App-${{ github.ref_name }}.dmg`, open it, and drag to Applications.
            
            **Linux:** Download `Resilient-Research-App-${{ github.ref_name }}.AppImage`, make executable (`chmod +x`), and run.
            
            ### System Requirements
            - Windows 10/11 (x64)
            - macOS 11+ (Intel & Apple Silicon)
            - Linux (glibc 2.28+, x64)
            - 4 GB RAM minimum (8 GB recommended)
            - 2 GB disk space
            
            ### LLM Configuration
            Configure your API keys in Settings (gear icon):
            - **Gemini API Key** (primary) - Get from https://aistudio.google.com/apikey
            - **Groq API Key** (fallback) - Get from https://console.groq.com/keys
            - **Local Model** (free) - Runs in-browser, no API key needed
            
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}